name: CineMatch AI CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Run Automated Pytest Suite
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify preprocessed dataset and model artifacts
        run: |
          python -c "from recommender import MovieRecommender; r = MovieRecommender(); assert r.load_artifacts(), 'Artifact loading failed'"

      - name: Run Pytest test suite
        run: |
          pytest -v --durations=10
